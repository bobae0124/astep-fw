# Example Astropix3 config
#
# The following yaml should comply to the structure below.
# It is important, that the order of configbits under the config section, corresponds to the actual order in the chip
#
# astropix<version>:
#   chain:
#        length: <number of chips in daisy chain>
#   geometry:
#       cols: <number of cols>
#       rows: <number of rows>
#   config:
#       <group-name>:
#           <configbit-name>: [<number of bits>, <value>]
#   ...
#

---
astropix3:
    chain:
        length: 4
    geometry:
        cols: 35
        rows: 35
    config_0:
        digitalconfig:
            interrupt_pushpull: [1, 0b0]
            en_inj:             [18, 0b0]
            reset:              [1, 0b0]
            extrabits:          [15, 0b0]

        biasconfig:
            DisHiDR:            [1, 0b0] # 1 -> 0(yml beam test FNAL last year)
            q01:                [1, 0b0]
            qon0:               [1, 0b0]
            qon1:               [1, 0b1]
            qon2:               [1, 0b0]
            qon3:               [1, 0b1]

        idacs:
            blres:              [6, 0]
            nu1:                [6, 0]
            vn1:                [6, 20]
            vnfb:               [6, 3] # 1->3(yml beam test FNAL last year)
            vnfoll:             [6, 5] # 1->4(yml beam test FNAL last year)->5[?]
            nu5:                [6, 0]
            nu6:                [6, 0]
            nu7:                [6, 0]
            nu8:                [6, 0]
            vn2:                [6, 0]
            vnfoll2:            [6, 5] # 1->10(yml beam test FNAL last year)->5[!]
            vnbias:             [6, 10]
            vpload:             [6, 5]
            nu13:               [6, 60]
            vncomp:             [6, 2]
            vpfoll:             [6, 60]
            nu16:               [6, 0]
            vprec:              [6, 30]
            vnrec:              [6, 30]

        vdacs: # vdac = voltage / 1.8 * 1024
            blpix:              [10, 568] # 1V = 568
            thpix:              [10, 738] # 100 mV threshold = 625, #738 = 300mV, 400mV = 795
            vcasc2:             [10, 625]
            nu1:                [10, 512]
            thpmos:             [10, 682]
            vinj:               [10, 341] # 300 mV = 171, 500mv=285, 700mv=398

